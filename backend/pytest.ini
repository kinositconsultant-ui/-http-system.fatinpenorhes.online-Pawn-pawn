[pytest]
# Preview-URL network flakes are common in the ingress-fronted test environment.
# pytest-rerunfailures auto-retries tests that fail with connection/timeout errors
# without hiding real assertion failures (assertion failures still fail once and
# only retry when they hit ReadTimeout/ConnectionError).
addopts = --reruns 2 --reruns-delay 2 --only-rerun "(ReadTimeout|ConnectTimeout|ConnectionError|MaxRetryError|Timeout)"
timeout = 30
testpaths = tests
